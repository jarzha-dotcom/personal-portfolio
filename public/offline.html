<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kamu sedang offline</title>
    <style>
        :root {
            color-scheme: light dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            color: #1e293b;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            padding: 24px;
            text-align: center;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #020617;
                color: #f8fafc;
            }

            p {
                color: #94a3b8 !important;
            }
        }

        .card {
            max-width: 360px;
        }

        .icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: #0d9488;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        h1 {
            font-size: 18px;
            margin: 0 0 8px;
        }

        p {
            font-size: 13px;
            color: #64748b;
            margin: 0 0 20px;
            line-height: 1.6;
        }

        button {
            background: #0d9488;
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        button:hover {
            background: #0f766e;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">KAJ</div>
        <h1>Kamu sedang offline</h1>
        <p>Koneksi internet terputus. Halaman yang pernah dibuka mungkin masih bisa diakses dari cache — periksa
            koneksimu lalu coba lagi.</p>
        <button onclick="location.reload()">Coba lagi</button>
    </div>
</body>

</html>
