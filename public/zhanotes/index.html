class="callout-del" contenteditable="false" title="Hapus kotak">\u2715</button><span style="font-size:16px;margin-right:4px">'+a+"</span> "+e+"</div>",WELCOME_BODY=['<p data-wv="6"><b>ZhaNotes</b> adalah ruang catatan &amp; <i>Personal Knowledge Management (PKM)</i> yang berjalan sepenuhnya di peramban Anda: <b>gratis, tanpa iklan pihak ketiga, tanpa akun, dan bisa dipakai offline</b>. Catatan Anda tidak dikirim ke server mana pun, kecuali Anda mengaktifkan sinkron awan (tersedia di edisi kustom).</p>',WB_CALLOUT("callout-succ","\u2705","<b>Janji pembuat:</b> tanpa iklan pihak ketiga, tanpa pelacak, tanpa langganan. Semua fitur di bawah ini bisa dipakai selamanya tanpa biaya."),"<h3>Mulai dalam 1 menit</h3>","<ul>","<li>Tekan <code>Alt+N</code> untuk catatan baru, <code>Alt+C</code> untuk kanvas, atau <code>Ctrl+K</code> untuk mencari dan menjalankan perintah.</li>","<li>Buka catatan <b>Contoh: Laporan Audit Stock Opname</b> untuk melihat PDF beranotasi (stabilo, coretan, lingkaran, panah, dan kartu catatan), dan <b>Contoh: Diagram Alur Rekonsiliasi Bank</b> untuk melihat kanvas.</li>","<li>Tekan <code>?</code> kapan saja untuk daftar pintasan lengkap.</li>","</ul>","<h3>Empat mode catatan</h3>","<ul>","<li><b>\u{1F4C4} Halaman:</b> editor teks kaya dengan heading, checklist, tabel, kotak catatan, gambar, dan perintah cepat <code>/</code>.</li>","<li><b>\u{1F3A8} Kanvas:</b> papan gambar tanpa batas dengan pena (peka tekanan), bentuk, kartu teks, dan konektor yang ikut bergerak.</li>","<li><b>\u{1F52C} Riset &amp; Kliping:</b> empat blok terstruktur: tautan, kutipan, tangkapan layar, dan catatan pribadi.</li>","<li><b>\u{1F4D5} PDF:</b> baca dan anotasi PDF langsung di peramban: pena, stabilo teks, stabilo bebas, kartu catatan, lalu ekspor PDF beranotasi.</li>","</ul>","<h3>Menghubungkan ide</h3>","<ul>","<li><b>Wiki Backlinks:</b> ketik <code>[[</code> lalu pilih judul untuk menautkan catatan. Panel <i>Hubungan &amp; Backlinks</i> di bawah catatan menampilkan tautan keluar dan masuk, dan <code>Alt+G</code> membuka peta grafis. Coba: [[Checklist Audit Kepatuhan SOP]] atau [[Riset Arsitektur Zero Server Cost]].</li>","<li><b>Perekam suara &amp; \u{1F4CD} penanda:</b> rekam rapat atau kuliah di bagian bawah catatan, lalu tandai momen penting untuk dilompati nanti.</li>","<li><b>Ekspor tanpa backend:</b> halaman ke Word, PDF, Markdown, TXT, HTML, atau JSON; kanvas ke PNG, SVG, atau PDF; PDF beranotasi ke PDF atau JSON.</li>","</ul>","<h3>Tentang pembuat &amp; edisi kustom</h3>","<p>ZhaNotes dibuat oleh <b>K. Arzhaning Jagad (Arzha)</b>, <i>Indie Developer &amp; Data/System Specialist</i> dengan pengalaman 7+ tahun di operasional dan audit korporat. Itu sebabnya contoh bawaan bertema audit: alur data yang rapi, mudah ditelusuri, dan dibangun dengan prinsip <i>Zero Server Cost</i>.</p>",WB_CALLOUT("callout-note","\u{1F3A8}",'<b>Ingin ZhaNotes dengan nama, logo, dan desain bisnis Anda?</b> Tersedia edisi kustom <i>beli putus</i> (tanpa langganan), termasuk opsi sinkron awan terenkripsi antar perangkat yang disiapkan di akun Vercel/penyimpanan milik Anda sendiri. Konsultasi gratis: WhatsApp <a href="https://wa.me/6282312312734" target="_blank" rel="noopener">+62 823-1231-2734</a> \xB7 <a href="https://arzhaning.my.id" target="_blank" rel="noopener">arzhaning.my.id</a> \xB7 admin@arzhaning.my.id.'),'<p>Karya lain yang bisa dicoba: <a href="https://bgames.arzhaning.my.id" target="_blank" rel="noopener">B-Games</a> (game papan multiplayer, bebas iklan), <a href="https://rapin.arzhaning.my.id" target="_blank" rel="noopener">Rajendra Pintar</a> (edukasi anak, bisa offline), <a href="https://assets.arzhaning.my.id" target="_blank" rel="noopener">Assets DEMO</a> (inventaris aset serverless), dan galeri <a href="https://arzhaning.my.id/demos" target="_blank" rel="noopener">30 demo desain &amp; aplikasi</a>.</p>',"<h3>Offline &amp; keamanan data</h3>",WB_CALLOUT("callout-info","\u2139\uFE0F","<b>Soal offline:</b> pembukaan pertama membutuhkan internet. Setelah pernah dibuka sekali, halaman tersimpan di cache peramban dan bisa dipakai tanpa internet, selama cache itu tidak dibersihkan."),WB_CALLOUT("callout-info","\u{1F4F2}","<b>Pasang sebagai aplikasi (PWA):</b> agar ZhaNotes terbuka dari layar utama seperti aplikasi biasa dan umumnya lebih jarang kena pembersihan data situs, pilih <b>Instal aplikasi</b> di menu peramban (mis. Chrome atau Edge di komputer dan Android) atau <b>Tambahkan ke layar utama</b> di ponsel (di iPhone: tombol Bagikan \u2192 Tambahkan ke Layar Utama). Nama dan letak opsinya bergantung pada peramban dan perangkat, dan tidak semua peramban menyediakannya."),WB_CALLOUT("callout-warn","\u26A0\uFE0F","<b>Data hanya ada di peramban ini.</b> Catatan, coretan, PDF, dan rekaman tersimpan di IndexedDB perangkat ini. Data bisa hilang jika data situs dihapus atau peramban diganti, dan tidak otomatis ada di perangkat lain. Buat cadangan ZIP secara berkala lewat <b>Data \u2192 Cadangan &amp; pulihkan</b>, lalu pulihkan di perangkat mana pun.")].join(""),RLK=(t,a,e,n)=>'<div class="lk" contenteditable="false"><a data-u="'+t+'" href="'+t+'">'+a+"</a><small>"+e+'</small><div class="lkn" contenteditable="true">'+n+"</div></div>",RESEARCH_BODY=['<p data-rv="4"><i>Pertanyaan riset:</i> bisakah aplikasi produktivitas lengkap (editor, whiteboard, anotasi PDF, perekam suara) berjalan tanpa server berbayar, tanpa iklan, dan tetap nyaman dipakai sehari-hari?</p>',"<h3>Tautan</h3>",RLK("https://developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API","IndexedDB API - MDN Web Docs","developer.mozilla.org","Penyimpanan di sisi klien berkapasitas besar. Dipakai ZhaNotes untuk catatan, PDF, dan rekaman audio."),RLK("https://developer.mozilla.org/en-US/docs/Web/API/Service_Worker_API","Service Worker API - MDN Web Docs","developer.mozilla.org","Dasar kemampuan offline: aset di-cache sehingga aplikasi terbuka tanpa internet setelah kunjungan pertama."),RLK("https://developer.mozilla.org/en-US/docs/Web/API/StorageManager/persist","StorageManager.persist() - MDN Web Docs","developer.mozilla.org","Meminta peramban tidak menghapus data situs saat ruang penyimpanan menipis. Penting untuk risiko kehilangan data."),RLK("https://arzhaning.my.id/artikel","Artikel Zero Server Cost &amp; Efisiensi Bisnis - arzhaning.my.id","arzhaning.my.id","Kumpulan artikel pembuat tentang arsitektur hemat biaya server, keamanan data, dan studi kasus sistem inventaris. Konteks praktis di balik desain ZhaNotes."),RLK("https://www.inkandswitch.com/essay/local-first/","Local-first software - Ink &amp; Switch","inkandswitch.com","Esai asal istilah local-first: tujuh cita-cita, termasuk kecepatan, kerja offline, dan kepemilikan data oleh pengguna."),"<h3>Kutipan</h3>","<blockquote>Local-first software enables both collaboration and ownership: it gives you the speed and privacy of local offline storage with the peace of mind of zero server hosting bills.<footer>\u2014 Rangkuman filosofi Local-First Software</footer></blockquote>","<blockquote>Data disimpan di perangkat pengguna; server (jika ada) hanya menjadi salinan opsional, bukan sumber kebenaran.<footer>\u2014 Prinsip desain yang dipakai ZhaNotes</footer></blockquote>","<h3>Tangkapan layar</h3>","<p>Tempel tangkapan layar referensi di sini (<code>Ctrl+V</code> atau <code>/gambar</code>), misalnya hasil uji kapasitas IndexedDB di peramban Anda.</p>","<h3>Catatan pribadi</h3>","<p><b>Temuan:</b></p>","<ul>","<li><b>Biaya:</b> tanpa backend, biaya operasional per pengguna mendekati nol, jadi aplikasi bisa gratis dan bebas iklan.</li>","<li><b>Privasi:</b> pada versi umum data tidak meninggalkan perangkat, sehingga tidak ada akun, pelacak, atau kebocoran dari server. Pada edisi kustom dengan sinkron awan, yang dikirim hanya salinan terenkripsi di peramban.</li>","<li><b>Kecepatan:</b> baca-tulis lokal tanpa menunggu jaringan; PDF dan kanvas besar tetap lancar.</li>","</ul>","<p><b>Risiko dan mitigasinya:</b></p>","<ul>","<li>Data terhapus bila data situs dibersihkan. <i>Mitigasi:</i> cadangan ZIP berkala dan permintaan penyimpanan persisten.</li>","<li>Tidak ada sinkron antar perangkat secara bawaan. <i>Mitigasi:</i> pindahkan lewat ZIP, atau pakai sinkron awan terenkripsi pada edisi kustom (Vercel + penyimpanan di akun pemilik) yang disiapkan bersama pembuat.</li>","<li>Kapasitas penyimpanan berbeda tiap peramban. <i>Mitigasi:</i> pantau ukuran PDF dan rekaman, ekspor catatan lama.</li>","</ul>",WB_CALLOUT("callout-succ","\u2705","<b>Kesimpulan:</b> aplikasi produktivitas profesional (editor Word/PDF, whiteboard, anotasi PDF) dapat berjalan mandiri 100% di peramban tanpa backend berbayar. Lihat contoh penerapannya di [[Checklist Audit Kepatuhan SOP]]."),'<p><b>Butuh sistem serupa untuk bisnis Anda?</b> Pola yang sama (data lokal, serverless, mudah diaudit) dipakai pembuat untuk aplikasi kustom. Konsultasi: <a href="https://wa.me/6282312312734" target="_blank" rel="noopener">+62 823-1231-2734</a> atau admin@arzhaning.my.id.</p>',"<p><b>Langkah berikutnya:</b> uji kapasitas pada perangkat murah, dan bandingkan ukuran cadangan ZIP untuk 1.000 catatan.</p>"].join("");function researchUpdate(){const t=S.notes.find(a=>a.t==="Riset Arsitektur Zero Server Cost");!t||t.u!==t.c||typeof t.body!="string"||t.body.includes('data-rv="4"')||(t.body=RESEARCH_BODY,t.tags&&!t.tags.includes("riset")&&t.tags.push("riset"),TXC.delete(t.id),dirty.add(t.id),save())}function guideUpdate(){const t=S.notes.find(a=>a.t==="Panduan Lengkap & Daftar Pintasan ZhaNotes");!t||t.u!==t.c||typeof t.body!="string"||t.body.includes('data-gv="12"')||(t.body=GUIDE_BODY,TXC.delete(t.id),dirty.add(t.id),save())}function welcomeUpdate(){const t=S.notes.find(a=>a.t==="Selamat Datang di ZhaNotes");!t||t.u!==t.c||typeof t.body!="string"||t.body.includes('data-wv="6"')||(t.body=WELCOME_BODY,TXC.delete(t.id),dirty.add(t.id),save())}const GUIDE_BODY=['<p data-gv="12"><b>ZhaNotes</b> adalah aplikasi ruang kerja pemikiran, catatan visual, dan <i>Personal Knowledge Management (PKM)</i> berkonsep <b>Local-First</b>. Semua catatan, coretan kanvas, berkas PDF, dan memo suara tersimpan aman di peramban tanpa server perantara (sinkron awan bersifat opsional dan hanya ada di edisi kustom).</p>',WB_CALLOUT("callout-succ","\u2705","<b>Privasi 100% &amp; Bebas Biaya Server:</b> Data Anda tersimpan di IndexedDB perangkat ini dan tidak dikirim ke pihak ketiga. Anda memegang kendali penuh atas data Anda melalui pencadangan ZIP berkala."),"<h3>1. Empat Mode Catatan Fleksibel</h3>","<ul>","<li><b>\u{1F4C4} Halaman (Dokumen Teks):</b> Editor teks kaya bebas hambatan dengan heading, checklist tugas, tabel, callout warna, gambar (resize/crop), dan perintah cepat garis miring (<code>/</code>).</li>","<li><b>\u{1F3A8} Kanvas Bebas (Whiteboard):</b> Lembar visual tanpa batas untuk corat-coret ide, menggambar dengan pena/stylus atau mouse, membuat bentuk (garis, kotak, elips), dan menempatkan kartu teks bebas yang dapat digeser. Kartu dan bentuk bisa dihubungkan dengan konektor yang ikut bergerak.</li>","<li><b>\u{1F52C} Riset &amp; Kliping:</b> Tata letak 4 blok terstruktur untuk mengumpulkan tautan web, kutipan penting, tangkapan layar, dan analisis catatan pribadi.</li>","<li><b>\u{1F4D5} Pembaca &amp; Anotator PDF:</b> Buka file PDF langsung di browser, beri coretan pena, stabilo teks rapi, stabilo bebas, tempel kartu catatan, dan unduh PDF beranotasi lengkap.</li>","</ul>","<h3>2. Mode Tampilan Bebas Distraksi</h3>","<ul>","<li><b>Mode Fokus / Zen (<kbd>Alt+Z</kbd>):</b> Menyembunyikan seluruh sidebar menu, daftar catatan, bilah atas, dan toolbar untuk memberikan lembar kerja penuh 100% layar. Tekan <kbd>Esc</kbd> untuk keluar.</li>","<li><b>Sembunyikan Toolbar (<kbd>Alt+M</kbd>):</b> Meminimalkan bilah alat atas agar bidang pandang catatan lebih luas.</li>","<li><b>Sembunyikan Semua Alat (<kbd>Alt+T</kbd>):</b> Menyembunyikan semua kontrol dengan tombol panggil cepat <code>\u2304 Alat</code> di pojok kanan atas.</li>","<li><b>Memanggil Bilah Alat di Mode Zen:</b> Di mode fokus, Anda dapat menekan tombol <kbd>Alt+T</kbd> atau klik tombol <code>\u{1F3A8} Alat</code> di pil pojok kanan atas untuk memunculkan toolbar sementara.</li>","</ul>","<h3>3. Pintasan Khusus Kanvas (Corat-Coret &amp; Gambar)</h3>","<p>Saat berada di catatan kanvas dan tidak sedang mengetik teks, Anda dapat beralih alat secara instan menggunakan tombol huruf:</p>",'<table style="width:100%;border-collapse:collapse;margin:12px 0">','<thead><tr style="border-bottom:2px solid var(--bd);text-align:left"><th style="padding:8px">Tombol</th><th style="padding:8px">Alat</th><th style="padding:8px">Fungsi</th></tr></thead>',"<tbody>",'<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>P</kbd></td><td style="padding:8px">\u270F\uFE0F Pena</td><td style="padding:8px">Menggambar atau corat-coret bebas dengan deteksi tekanan stylus/mouse</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>E</kbd></td><td style="padding:8px">\u{1F9FD} Penghapus</td><td style="padding:8px">Menghapus garis coretan saat disentuh/diklik</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>S</kbd> atau <kbd>V</kbd></td><td style="padding:8px">\u2B1A Pilih</td><td style="padding:8px">Memilih goresan atau kartu teks, menggeser, dan mengubah ukuran</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>H</kbd></td><td style="padding:8px">\u270B Geser Kanvas</td><td style="padding:8px">Menggeser (pan) sudut pandang kanvas tanpa mencoret</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>T</kbd></td><td style="padding:8px">T Teks</td><td style="padding:8px">Klik di kanvas untuk membuat kartu teks baru yang dapat digeser</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>R</kbd></td><td style="padding:8px">\u25FB Bentuk</td><td style="padding:8px">Menggambar garis lurus, kotak, atau elips</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>C</kbd></td><td style="padding:8px">\u{1F517} Konektor</td><td style="padding:8px">Seret dari kartu/bentuk ke kartu/bentuk lain; ujung terkunci dan ikut bergerak. Tahan Alt untuk ujung bebas</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>L</kbd></td><td style="padding:8px">\u27B0 Seleksi Bebas</td><td style="padding:8px">Beralih antara seleksi Kotak dan Bebas (lasso). Di mode Bebas, lingkari objek yang ingin dipilih</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>G</kbd></td><td style="padding:8px">Latar kanvas</td><td style="padding:8px">Berganti latar: Titik, Kisi, Garis, Polos (disimpan per catatan)</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>Shift+G</kbd></td><td style="padding:8px">\u{1F9F2} Snap ke kisi</td><td style="padding:8px">Menyalakan atau mematikan snap untuk bentuk dan kartu teks baru. Tahan Alt untuk melewati sementara</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>Ctrl+G</kbd></td><td style="padding:8px">\u25A3 Kelompokkan</td><td style="padding:8px">Menyatukan objek terpilih supaya dipilih, dipindah, dan diratakan bersama. <kbd>Ctrl+Shift+G</kbd> memisahkan. Kunci objek dan Sebar rata ada di menu klik kanan (tekan lama di HP)</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>1</kbd> \u2013 <kbd>4</kbd></td><td style="padding:8px">Preset pena</td><td style="padding:8px">Memakai preset jenis, warna, dan tebal. Shift+klik angka di toolbar menyimpan pengaturan sekarang ke slot itu</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>+</kbd> / <kbd>=</kbd></td><td style="padding:8px">Perbesar</td><td style="padding:8px">Zoom in tampilan kanvas</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>-</kbd> / <kbd>_</kbd></td><td style="padding:8px">Perkecil</td><td style="padding:8px">Zoom out tampilan kanvas</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>I</kbd></td><td style="padding:8px">Pipet warna</td><td style="padding:8px">Klik goresan/bentuk untuk mengambil warna garisnya; Shift+klik mengambil warna isinya dan menerapkannya ke bentuk terpilih</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>Z</kbd></td><td style="padding:8px">Zoom ke objek</td><td style="padding:8px">Memperbesar dan memusatkan tampilan ke objek terpilih</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>M</kbd></td><td style="padding:8px">Minimap</td><td style="padding:8px">Menampilkan atau menyembunyikan peta mini kanvas</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>0</kbd></td><td style="padding:8px">\u2922 Pas Layar</td><td style="padding:8px">Menyesuaikan zoom agar seluruh isi gambar terlihat</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>Del</kbd> / <kbd>Backspace</kbd></td><td style="padding:8px">Hapus Objek</td><td style="padding:8px">Menghapus kartu teks atau goresan yang sedang dipilih</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>Ctrl+Z</kbd> / <kbd>Ctrl+Y</kbd></td><td style="padding:8px">Undo / Redo</td><td style="padding:8px">Membatalkan atau mengulangi goresan terakhir</td></tr>',"</tbody>","</table>",WB_CALLOUT("callout-info","\u{1F4A1}","<b>Tips Layar Sentuh / Tablet:</b> Secara default, satu jari digunakan untuk menggeser kanvas dan dua jari untuk memperbesar/memperkecil (pinch-to-zoom). Aktifkan tombol <b>\u261D Jari</b> di toolbar jika Anda ingin menulis langsung menggunakan jari tangan."),"<h3>4. Daftar Lengkap Pintasan Keyboard Global</h3>",'<table style="width:100%;border-collapse:collapse;margin:12px 0">','<thead><tr style="border-bottom:2px solid var(--bd);text-align:left"><th style="padding:8px">Pintasan</th><th style="padding:8px">Perintah</th><th style="padding:8px">Keterangan</th></tr></thead>',"<tbody>",'<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>Ctrl+K</kbd></td><td style="padding:8px">Palet Perintah</td><td style="padding:8px">Cari catatan atau jalankan perintah dengan awalan <code>&gt;</code></td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>Alt+N</kbd></td><td style="padding:8px">Catatan Baru</td><td style="padding:8px">Membuat catatan dokumen Halaman kosong</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>Alt+C</kbd></td><td style="padding:8px">Kanvas Baru</td><td style="padding:8px">Membuka lembar Kanvas gambar kosong</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>Alt+J</kbd></td><td style="padding:8px">Tangkap Cepat</td><td style="padding:8px">Menyimpan ide atau catatan kilat dari mana saja</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>Alt+Z</kbd></td><td style="padding:8px">Mode Fokus (Zen)</td><td style="padding:8px">Beralih ke mode layar penuh tanpa gangguan</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>Alt+T</kbd></td><td style="padding:8px">Sembunyikan Alat</td><td style="padding:8px">Sembunyikan atau tampilkan seluruh bilah alat</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>Alt+M</kbd></td><td style="padding:8px">Sembunyikan Toolbar</td><td style="padding:8px">Sembunyikan atau tampilkan toolbar format</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>Alt+O</kbd></td><td style="padding:8px">Daftar Isi (Outline)</td><td style="padding:8px">Navigasi cepat berdasarkan judul H1, H2, H3 di catatan</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>Alt+G</kbd></td><td style="padding:8px">Graph Backlinks</td><td style="padding:8px">Visualisasi jaringan keterkaitan antar catatan</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>Alt+B</kbd></td><td style="padding:8px">Toggle Sidebar Menu</td><td style="padding:8px">Sembunyikan atau buka bilah navigasi kiri</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>Alt+L</kbd></td><td style="padding:8px">Toggle Daftar Catatan</td><td style="padding:8px">Sembunyikan atau buka daftar list catatan</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>Alt+F</kbd></td><td style="padding:8px">Toggle Kedua Sidebar</td><td style="padding:8px">Sembunyikan atau tampilkan kedua bilah samping</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>Alt+[</kbd> / <kbd>Alt+]</kbd></td><td style="padding:8px">Navigasi Tab</td><td style="padding:8px">Pindah ke tab catatan sebelumnya / berikutnya</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>Alt+W</kbd></td><td style="padding:8px">Tutup Tab</td><td style="padding:8px">Menutup tab catatan yang sedang aktif</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>Ctrl+F</kbd> / <kbd>Ctrl+H</kbd></td><td style="padding:8px">Cari &amp; Ganti</td><td style="padding:8px">Mencari teks dan mengganti kata di dalam catatan aktif</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>Esc</kbd></td><td style="padding:8px">Tutup / Batal</td><td style="padding:8px">Menutup modal, menu, atau keluar dari mode fokus</td></tr>','<tr style="border-bottom:1px solid var(--bd)"><td style="padding:8px"><kbd>?</kbd> / <kbd>F1</kbd></td><td style="padding:8px">Bantuan &amp; Panduan</td><td style="padding:8px">Membuka jendela panduan dan pintasan ini</td></tr>',"</tbody>","</table>","<h3>5. Perintah Garis Miring (Slash Commands: <code>/</code>)</h3>","<p>Ketik tanda <code>/</code> di awal baris baru pada editor halaman untuk memunculkan menu perintah cepat:</p>","<ul>","<li><code>/h1</code>, <code>/h2</code>, <code>/h3</code> \u2014 Judul Utama (H1), Sub-Judul (H2), atau Bagian Kecil (H3).</li>","<li><code>/todo</code> atau <code>/centang</code> \u2014 Daftar tugas interaktif dengan checkbox.</li>","<li><code>/poin</code> atau <code>/bullet</code> \u2014 Daftar poin bulatan tidak berurut.</li>","<li><code>/nomor</code> \u2014 Daftar urutan angka otomatis (1, 2, 3).</li>","<li><code>/kutipan</code> \u2014 Kotak kutipan penting (blockquote).</li>","<li><code>/kode</code> \u2014 Kotak kode program berlatar monospace.</li>","<li><code>/tabel</code> \u2014 Sisipkan tabel baru yang bisa ditambah/kurang baris dan kolom.</li>","<li><code>/garis</code> \u2014 Garis pembatas horizontal tipis.</li>","<li><code>/info</code>, <code>/peringatan</code>, <code>/sukses</code>, <code>/catatan</code>, <code>/bahaya</code>, <code>/tips</code>, <code>/contoh</code>, <code>/definisi</code>, <code>/pertanyaan</code>, <code>/kutipan</code>, <code>/tugas</code> \u2014 11 jenis kotak callout berwarna untuk pesan penting.</li>","<li><code>/gambar</code> \u2014 Unggah dan sisipkan gambar (dapat diubah ukuran dan perataan).</li>","<li><code>/sketsa</code> \u2014 Buka pad gambar kecil untuk menulis tanda tangan / diagram tangan.</li>","<li><code>/tautan</code> \u2014 Sisipkan link URL web eksternal.</li>","<li><code>/wiki</code> \u2014 Buat tautan internal <code>[[Judul Catatan]]</code>.</li>","<li><code>/tanggal</code> &amp; <code>/jam</code> \u2014 Sisipkan tanggal atau waktu hari ini secara otomatis.</li>","</ul>","<h3>6. Wiki Backlinks <code>[[ ]]</code> &amp; Peta Grafis</h3>","<p>Cukup ketik <code>[[</code> di editor dokumen untuk memunculkan daftar catatan yang ingin Anda tautkan. Di bagian bawah catatan, panel <b>Hubungan &amp; Backlinks</b> secara otomatis menampilkan tautan keluar, tautan masuk, dan visualisasi graph (<kbd>Alt+G</kbd>).</p>","<h3>7. Perekam Suara Tersemat &amp; Penanda Waktu</h3>","<p>Di bagian bawah setiap catatan dokumen, buka panel referensi lalu tekan tombol <b>Rekam</b> untuk menyimpan memo suara rapat, perkuliahan, atau ide spontan. Selama merekam, tekan <b>\u{1F4CD} Penanda</b> untuk menandai momen penting; penanda tampil di daftar rekaman dan bisa diklik untuk melompat ke momen itu.</p>","<h3>8. Ekspor &amp; Keamanan Data</h3>","<ul>","<li><b>Ekspor Dokumen:</b> Konversi catatan menjadi file Microsoft Word (.docx), PDF, Markdown (.md), Teks (.txt), atau HTML melalui menu <code>\u22EF</code> &gt; <b>\u2B07 Ekspor</b>.</li>","<li><b>Ekspor Kanvas:</b> Simpan hasil gambar kanvas ke format gambar PNG berkualitas tinggi, SVG vektor, atau PDF.</li>","<li><b>Cadangan Lengkap:</b> Buka <b>Data \u2192 Cadangan &amp; pulihkan</b> di bilah sisi untuk mengunduh seluruh ruang kerja Anda ke dalam satu file ZIP.</li>","</ul>","<h3>Sinkron Awan Otomatis (edisi khusus)</h3>",WB_CALLOUT("callout-info","\u2139\uFE0F","<b>Catatan edisi:</b> versi umum ZhaNotes bekerja sepenuhnya offline dan lokal. Sinkron awan hanya tersedia pada edisi khusus yang disiapkan bersama penyedia aplikasi, dengan penyimpanan di akun milik pemilik edisi tersebut."),"<ul>","<li><b>Aktifkan:</b> <b>kartu Ruang kerja saya</b> di kiri bawah bilah sisi, isi token akses dan kata sandi enkripsi. Setelah itu setiap perubahan terkirim sendiri ke cloud dan muncul di perangkat lain; tidak perlu cadangan manual.</li>","<li><b>Terenkripsi di perangkat:</b> isi catatan, PDF, dan rekaman dienkripsi sebelum dikirim. Kata sandi enkripsi tidak disimpan di server, jadi jangan sampai lupa.</li>","<li><b>Gabung otomatis:</b> bila satu catatan diubah di dua perangkat pada bagian yang berbeda (paragraf berbeda, objek dan konektor kanvas berbeda, ikon atau warna label), keduanya digabung sendiri dan versi sebelumnya masuk Riwayat. Bila bagian yang sama diubah di dua tempat, muncul layar perbandingan dengan pilihan Gabungkan, pakai versi perangkat ini, pakai versi cloud, atau simpan keduanya.</li>","<li><b>Log debug (pemeliharaan):</b> tombol <b>\u{1F41E} Log</b> di jendela Sinkron awan hanya muncul bila penyedia aplikasi mengaktifkannya di server. Log tidak berisi token, kata sandi, atau isi catatan.</li>","</ul>","<h3>9. Konektor, Tugas, Ikon &amp; Tab</h3>","<ul>","<li><b>Konektor &amp; bentuk:</b> klik ganda konektor, bentuk, atau kartu (alat Pilih) untuk menulis teks. Pilih bentuk tertutup lalu klik warna <i>Isi</i> di toolbar untuk mewarnainya.</li>","<li><b>Tugas:</b> edit teks langsung, hapus (bisa diurungkan), filter per catatan atau tag, dan pengulangan. Tulis <code>~mingguan</code> (harian, harikerja, 2mingguan, bulanan, tahunan) di teks tugas atau pilih dari menu \u21BB; saat dicentang tenggatnya maju otomatis.</li>","<li><b>Ikon &amp; warna label:</b> menu \u22EF \u2192 \u{1F3A8}, atau klik ikon di samping judul.</li>","<li><b>Tab:</b> seret untuk mengurutkan (tahan lama di layar sentuh). <kbd>Alt+Shift+T</kbd> atau tombol \u21BA membuka kembali tab yang ditutup.</li>","</ul>","<h3>10. Fitur Lanjutan Kanvas</h3>","<ul>","<li><b>Pengenal bentuk:</b> saat menggambar dengan Pena, tahan sejenak (sekitar setengah detik) di akhir coretan; coretan dirapikan otomatis menjadi garis lurus, kotak, lingkaran/elips, segitiga, belah ketupat, segi lima, segi enam, bintang, trapesium, jajar genjang, garis melengkung, kurva S, gelombang, atau lingkaran kuas (cincin yang tidak ditutup rapat). Bentuk dikenali bila berdiri tegak; coretan bebas biasa tidak berubah. Hasilnya goresan bentuk biasa (bisa diisi, diberi label, disambung konektor). Matikan/nyalakan lewat <kbd>Ctrl+K</kbd> \u2192 <i>Kanvas: pengenal bentuk</i>.</li>","<li><b>Bentuk manual (alat \u25FB, 23 bentuk):</b> garis, panah, kotak, elips, segitiga, belah ketupat, segi lima, segi enam, trapesium, jajar genjang, bintang, hati, tambah (+), centang, gelombang, garis lengkung, lengkung landai, kurva S, lingkaran kuas, dan lainnya. Tahan <kbd>Shift</kbd> saat menyeret untuk mengunci sudut 45\xB0 atau rasio 1:1.</li>","<li><b>Minimap (<kbd>M</kbd>):</b> peta mini di pojok kanan bawah; klik atau seret untuk pindah tampilan.</li>","<li><b>Pipet warna (<kbd>I</kbd>):</b> klik goresan atau bentuk untuk mengambil warna garisnya; <kbd>Shift</kbd>+klik mengambil warna isinya dan menerapkannya sebagai warna isi bentuk tertutup yang sedang dipilih. <kbd>Esc</kbd> membatalkan.</li>","<li><b>Zoom ke objek terpilih (<kbd>Z</kbd>)</b> dan <b>Cari objek (<kbd>Ctrl+F</kbd>)</b> untuk teks kartu, label bentuk, dan label konektor.</li>","<li><b>Ekspor/salin objek terpilih:</b> klik kanan (tekan lama di HP) \u2192 <i>Ekspor sebagai PNG</i> atau <i>Salin sebagai gambar</i>.</li>","<li><b>Label toolbar:</b> <kbd>Ctrl+K</kbd> \u2192 <i>Toolbar: ikon saja / ikon + label / otomatis</i> (Kanvas dan PDF di layar lebar).</li>","<li><b>Gambar sebagai objek:</b> tombol <b>\u{1F5BC} Gambar</b> di toolbar (atau <kbd>Ctrl+V</kbd> untuk menempel gambar, atau seret berkas gambar ke kanvas; juga <kbd>Ctrl+K</kbd> \u2192 <i>Kanvas: sisipkan gambar sebagai objek</i>). Gambar menjadi kartu: geser lewat gagangnya, ubah ukuran lewat pojok kanan bawah, kunci, kelompokkan, sambung dengan konektor, dan ikut ekspor PNG/SVG/PDF. Gambar besar diperkecil otomatis (maks. 1600 px). Klik dua kali kartu gambar (atau klik kanan \u2192 <i>Potong gambar\u2026</i>) untuk memotong sisinya. Klik kanan area kosong \u2192 <i>Sisipkan halaman PDF\u2026</i> menyisipkan satu halaman PDF sebagai gambar. Catatan: gambar menambah ukuran catatan dan data sinkron.</li>","</ul>","<h3>11. Pencarian Global, Cetak &amp; Sitasi</h3>","<ul>","<li><b>Filter pencarian</b> (<kbd>Alt</kbd>/<kbd>Ctrl+K</kbd>): <code>#tag</code>, <code>tipe:</code> (halaman, kanvas, riset, pdf), <code>folder:</code>, <code>dalam:7</code> (hari terakhir), <code>sejak:2026-10-01</code>, <code>sebelum:2026-10-31</code> (hari itu ikut). Bisa digabung; tombol \u2605 Simpan menyimpan pencarian (maks. 8).</li>","<li><b>Cari &amp; Ganti</b> (<kbd>Ctrl+F</kbd>/<kbd>Ctrl+H</kbd>): tombol <code>Aa</code> peka huruf besar/kecil, tombol <code>.*</code> regex; kolom ganti mendukung <code>$1</code>, <code>$2</code>. Pola salah menampilkan <code>regex \u2717</code>.</li>","<li><b>Cetak:</b> <kbd>Ctrl+P</kbd> mencetak isi catatan saja. Atur kertas (A4, Letter, Legal, F4), arah, dan margin lewat <kbd>Ctrl+K</kbd> \u2192 <i>Cetak: atur kertas, arah &amp; margin</i>.</li>","<li><b>Sitasi:</b> <kbd>Ctrl+K</kbd> \u2192 <i>Sisipkan: Sitasi / referensi</i> (APA 7, Harvard, IEEE, Chicago, MLA 9, Vancouver, BibTeX, atau RIS; artikel, buku, web, skripsi/tesis, laporan). Diproses di perangkat.</li>","<li><b>PDF:</b> cari teks (<kbd>Ctrl+F</kbd>), daftar anotasi, thumbnail &amp; daftar isi (\u25A6 Halaman), garis bawah dan coret teks, dan \u{1F4DD} Ke catatan.</li>","<li><b>Bagikan catatan sebagai teks</b>: <kbd>Ctrl+K</kbd> \u2192 <i>Bagikan catatan sebagai teks</i>.</li>","<li><b>\u{1F4DA} Status baca per sumber</b> (Halaman dan Riset, semua edisi): tab Sisipkan \u2192 <i>\u{1F4DA} Sumber</i> menyisipkan satu baris sumber (judul, tautan atau DOI, catatan) dengan lencana \u25CB Belum dibaca \u2192 \u25D0 Sedang dibaca \u2192 \u2713 Selesai; klik lencana untuk mengganti. <i>\u{1F4CA} Progres</i> menampilkan persentase yang selesai, dan daftar catatan menampilkan progres seperti <code>\u{1F4DA} 2/5</code>.</li>","</ul>","<h3>11b. Toolbar Melayang (semua jenis catatan)</h3>","<ul>","<li><b>Apa itu:</b> toolbar diubah menjadi satu tombol bulat yang bisa dipindah. Klik tombolnya untuk membuka kartu alat (Halaman/Riset: tab Teks, Paragraf, Lanjutan, Sisipkan; Kanvas dan PDF: semua alat). Setelah satu alat dipilih, kartu menutup sendiri dan kembali jadi tombol. Alat yang membuka panel atau menu (Tabel, warna, Bentuk, Pena\u2026) menutup kartu setelah pilihan dibuat atau tombol <b>\u2713 OK</b> ditekan.</li>","<li><b>Menyalakan:</b> tombol <b>\u21F2 Melayang</b> di atas toolbar, atau <kbd>Ctrl+K</kbd> \u2192 <i>Toolbar: tombol alat melayang</i>. Untuk kembali: <b>\u21F1 Toolbar biasa</b> di kartu. Di <b>mode fokus</b> (<kbd>Alt+Z</kbd>) tombol ini selalu muncul.</li>","<li><b>Memindah:</b> seret tombolnya; saat dilepas ia menempel ke tepi kiri atau kanan dan posisinya diingat di perangkat. Di Kanvas dan PDF ikon tombol mengikuti alat yang aktif. <kbd>Esc</kbd> atau ketuk di luar kartu menutupnya.</li>","</ul>","<h3>11c. Simbol &amp; Template Catatan</h3>","<ul>","<li><b>\u03A9 Simbol:</b> tombol Simbol di tab Sisipkan membuka pemilih dengan 24 kategori (operator, himpunan dan logika, huruf Yunani, satuan, kimia dan fisika, pangkat dan indeks, pecahan, angka berlingkar, tanda baca, mata uang, huruf beraksen, panah, bentuk, garis dan kotak, centang dan bintang, musik dan kartu, cuaca dan lainnya, serta 7 kategori emoji). Pilih kategori lewat dropdown, pindah halaman dengan \u2039 \u203A. Kategori <i>Terakhir dipakai</i> menyimpan 24 simbol terakhir di perangkat ini.</li>","<li><b>\u{1F3A8} Ikon catatan:</b> menu <i>Ikon &amp; warna label</i> memuat 11 kategori emoji (umum, kerja dan kantor, keuangan, belajar dan sains, kesehatan dan olahraga, rumah dan keluarga, makanan, alam dan hewan, perjalanan, hiburan, simbol dan warna) dengan paginasi 48 ikon per halaman.</li>","<li><b>\u{1F5D2} Kotak callout:</b> 11 jenis (info, peringatan, sukses, catatan, bahaya, tips, contoh, definisi, pertanyaan, kutipan, tugas) lewat tombol <i>Kotak</i>, perintah <code>/</code>, atau <kbd>Ctrl+K</kbd>.</li>","<li><b>\u{1F4CB} Template:</b> <kbd>Ctrl+K</kbd> lalu <i>Buat dari template\u2026</i>. Ada 72 template dalam 9 kategori (harian dan perencanaan, kerja dan proyek, belajar dan riset, pribadi dan refleksi, keuangan, kesehatan dan gaya hidup, acara dan perjalanan, anak dan latihan, panduan). Gunakan kolom cari, dropdown kategori (menampilkan jumlah per kategori), dan \u2039 \u203A untuk pindah halaman.</li>","</ul>","<h3>12. Fitur Khusus Edisi Kustom (butuh internet)</h3>","<p>Muncul hanya bila Sinkron awan aktif. Di Halaman dan Riset ada tab <b>\u2728 Kustom</b> di toolbar (Rumus, Diagram, Wikipedia, OCR, Dikte, Tautan, Bagikan); di Kanvas dan PDF ada tombol <b>\u2728 Kustom</b> yang membuka menu. Semuanya juga ada di <kbd>Ctrl+K</kbd> \u2192 <i>Kustom: \u2026</i>. Hasilnya disimpan di catatan sehingga tetap tampil offline; mengubah atau membuat baru butuh internet.</p>","<ul>","<li><b>\u2211 Rumus (KaTeX):</b> tulis LaTeX atau pilih dari <i>Contoh rumus</i> (147 contoh dalam 10 kelompok: matematika dasar, bangun datar, bangun ruang, aljabar dan kalkulus, trigonometri dan geometri analitik, kalkulus lanjut dan vektor, fisika, kimia, statistik dan peluang, serta akuntansi dan keuangan), lihat pratinjau, sisipkan sebagai MathML. Di ekspor dan pencarian, rumus dibaca sebagai <code>$\u2026$</code>. Di Kanvas rumus menjadi kartu gambar yang menyimpan kode TeX-nya (klik dua kali kartu untuk mengedit); di PDF rumus masuk sebagai kartu teks <code>$\u2026$</code>. Rumus di tengah kalimat tetap sebaris; penyisipan ini tidak bisa dibatalkan dengan <kbd>Ctrl+Z</kbd>, hapus dengan <kbd>Backspace</kbd>.</li>","<li><b>\u25C7 Diagram Mermaid:</b> tulis kode atau pilih dari <i>Contoh diagram</i> (40 contoh dalam 5 kelompok: alur dan keputusan, akuntansi dan bisnis, organisasi dan sistem, jadwal dan waktu, serta ide, analisis, dan pengguna; mencakup flowchart, sequence, state, class, ER, gantt, pie, mindmap, timeline, journey, quadrant, dan Git). Disimpan sebagai gambar SVG; klik dua kali untuk mengubah kodenya. Ikut di ekspor Word dan PDF sebagai gambar PNG. Di Kanvas, diagram menjadi kartu gambar (klik dua kali kartu untuk mengedit).</li>","<li><b>\u{1F4E4} Bagikan</b> (tombol \u{1F4E4} di header catatan): edisi biasa membuka menu Bagikan bawaan perangkat: teks untuk Halaman/Riset, berkas PNG untuk Kanvas, berkas PDF untuk PDF (bila perangkat tidak punya menu Bagikan untuk berkas, berkas diunduh). Edisi kustom membagikan lewat tautan terenkripsi dengan tiga jenis. <i>Salinan</i>: snapshot tetap, baca-saja. <i>Tautan hidup</i>: baca-saja, tautan yang sama menampilkan versi terbaru setelah kamu menekan <i>Perbarui</i> (di dialog Bagikan catatan itu). <i>Edit bersama</i> (khusus catatan teks): penerima bisa mengedit dan menyimpan ke tautan yang sama, tetapi tidak bisa menghapus, mencabut, atau memperpanjang; edit yang bentrok ditolak server (penerima diberi pilihan memuat ulang atau menyimpan pekerjaannya sebagai catatan sendiri), dan satu versi sebelumnya selalu disimpan (tombol <i>Versi sebelumnya</i>). Kalau penerima sudah mengubah tautan, <i>Perbarui</i> menanyakan dulu sebelum menimpa. Pilih masa berlaku (1, 7, 30 hari, atau tanpa batas, pilihan terakhir diingat), tekan <i>Bagikan\u2026</i>, lalu <i>Kirim ke\u2026</i>; perangkat tanpa menu Bagikan mendapat tombol WhatsApp, Email, dan Salin. Tautan tidak otomatis disalin; <i>Cabut tautan ini</i> tersedia langsung di hasilnya. Isi dienkripsi di perangkatmu; kunci baca (dan kunci tulis untuk tautan edit) hanya ada di tautan setelah <code>#</code>, jadi server hanya menyimpan data terenkripsi. Kanvas dibagikan sebagai gambar PNG; PDF sebagai gambar halaman terpilih (mis. <code>1-3,5</code>, maks. 12) tanpa anotasi. <i>Semua tautan aktif</i> (bisa dilipat) punya Salin, Perbarui, Versi sebelumnya, Perpanjang, Matikan edit, dan Cabut (maks. 50 tautan, sekitar 3,5 MB). Penerima bisa membuka tautan tanpa edisi kustom dan menyimpannya sebagai catatan. Siapa pun yang memegang tautan edit bisa mengubah isinya: kirim hanya ke orang yang kamu percaya.</li>","<li><b>\u{1F517} Pratinjau tautan:</b> tempel alamat situs, lalu judul, nama situs, dan deskripsinya masuk sebagai kartu bertautan (tanpa gambar). Hanya situs web publik.</li>","<li><b>\u{1F524} OCR</b> foto atau halaman PDF pindaian (Indonesia + Inggris), <b>\u{1F310} Kutip Wikipedia</b> (pilih dari 50 contoh topik dalam 7 bidang), <b>Isi sitasi dari DOI</b>, dan <b>\u{1F3A4} Dikte suara</b>. Di K 0.000"]],3,zSp2(5,"tot","Total tahap 2"))}<h3>3\uFE0F\u20E3 Lantai &amp; plafon</h3>${zGen(zRbC,[["Keramik 60\xD760","15","m\xB2","110.000"],["Perekat keramik","6","sak","95.000"],["Plafon PVC","12","m\xB2","85.000"]],3,zSp2(5,"tot","Total tahap 3"))}<h3>4\uFE0F\u20E3 Listrik &amp; air</h3>${zGen(zRbC,[["Kabel NYM","50","meter","12.000"],["Saklar &amp; stop kontak","8","buah","25.000"],["Pipa PVC","6","batang","45.000"]],3,zSp2(5,"tot","Total tahap 4"))}<h3>5\uFE0F\u20E3 Finishing &amp; cat</h3>${zGen(zRbC,[["Cat tembok","3","pail","550.000"],["Plamir &amp; amplas","1","paket","200.000"]],3,zSp2(5,"tot","Total tahap 5"))}<h3>\u{1F477} Upah &amp; dana tak terduga</h3>${zGen(zRbC,[["Upah tukang","20","hari","150.000"],["Dana tak terduga (sekitar 5\u201310%)","1","paket","500.000"]],3,zSp2(5,"tot","Total upah &amp; cadangan"))}<h3>\u{1F4CA} Ringkasan</h3><table class="ed-table zn-calc"><thead><tr><th>Ringkasan</th><th data-c="s">Jumlah</th></tr></thead><tbody><tr data-r="grand"><td><b>Total semua tahap</b></td>${zF}</tr><tr data-r="bud"><td><b>Anggaran tersedia (ketik)</b></td>${zTd("",1)}</tr><tr data-r="sisa"><td><b>Sisa anggaran (merah = melebihi)</b></td>${zF}</tr></tbody></table><p><br></p><h3>\u{1F4DD} Catatan &amp; keputusan</h3><p><br></p>`},{k:"bug",c:TCATS[1],i:"\u{1F41E}",l:"Laporan bug",d:"Langkah reproduksi, hasil diharapkan vs aktual",t:()=>"Bug: ",tags:["bug"],b:()=>`<h2>Ringkasan</h2><p><br></p><p><b>Tingkat keparahan:</b> &nbsp; <b>Lingkungan:</b> </p><h3>Langkah mereproduksi</h3>${tplO(3)}<h3>Hasil yang diharapkan</h3><p><br></p><h3>Hasil aktual</h3><p><br></p><h3>Log / tangkapan layar</h3><pre class="code-blk"><br></pre><p><br></p>`},{k:"bacaan",c:TCATS[2],i:"\u{1F4D6}",l:"Ringkasan bacaan",d:"Buku/artikel: ide utama, kutipan, aksi",t:()=>"Bacaan: ",b:()=>`<h2>Ringkasan</h2><p><b>Sumber:</b> </p><p><b>Penulis:</b> </p><h3>\u{1F4A1} Ide utama</h3><ul><li><br></li></ul><h3>\u275D Kutipan penting</h3><blockquote>\u2026</blockquote><h3>\u2705 Yang akan s otal; dibayar dan kembalian/kurang otomatis",tags:["keuangan","usaha"],t:()=>"Kuitansi "+isoD(),b:()=>`<h2>Kuitansi / Penawaran</h2><p><b>No.:</b> &nbsp; <b>Tanggal:</b> ${idD()}</p><p><b>Kepada:</b> </p>${zHint2}${zGen([["Item"],["Jml","q",1],["Satuan"],["Harga satuan","p",1],["Subtotal","s"]],[["Jasa desain logo","1","paket","500.000"],["Cetak kartu nama","2","box","75.000"]],4,zSp2(5,"tot","Total")+zSp2(5,"bud","Dibayar (ketik)",1)+zSp2(5,"sisa","Kembalian (merah = kurang)"))}<p><b>Catatan / berlaku sampai:</b> </p><p><b>Hormat kami,</b></p><p><br></p>`},{k:"tagihan",c:TCATS[4],i:"\u{1F5D3}",l:"Tagihan bulanan",d:"Jatuh tempo dan nominal, centang sudah dibayar; total, sudah dibayar, belum dibayar otomatis",tags:["keuangan","tagihan"],t:()=>"Tagihan bulanan "+isoD().slice(0,7),b:()=>`<h2>Tagihan Bulanan</h2><p class="mu">Isi <b>Jumlah</b> tiap tagihan dan tulis jatuh tempo (mis. tgl 5). Centang <b>Dibayar</b> setelah lunas: baris Sudah dibayar dan Belum dibayar ikut berubah. Isi dana yang disiapkan untuk melihat sisanya. Angka boleh ditulis 350000, 350.000, Rp350.000, 350rb, atau 1,5jt. Baris contoh hanya contoh. Tambah baris lewat menu Tabel.</p>${zGen(zTgC,[["Listrik","tgl 20","450.000"],["Air (PDAM)","tgl 15","120.000"],["Internet","tgl 5","350.000"],["Cicilan","tgl 1","2.500.000"],["Pulsa &amp; paket data","tgl 10","150.000"],["Iuran lingkungan","tgl 5","75.000"]],4,zSpAt(zTgC,"tot","Total tagihan bulan ini")+zSpAt(zTgC,"paid","Sudah dibayar")+zSpAt(zTgC,"unpaid","Belum dibayar")+zSpAt(zTgC,"bud","Dana yang disiapkan (ketik)",1)+zSpAt(zTgC,"sisa","Sisa setelah semua lunas (merah = kurang)"))}`},{k:"pengeluarankat",c:TCATS[4],i:"\u{1F4CA}",l:"Pengeluaran bulanan per kategori",d:"Catat per tanggal di lima kategori; total tiap kategori, total semua, dan sisa otomatis",tags:["keuangan","pengeluaran"],t:()=>"Pengeluaran per kategori "+tplBln(),b:()=>`<h2>Pengeluaran Bulanan</h2><p class="mu">Catat setiap pengeluaran di kategorinya: tanggal, keterangan, jumlah. Total tiap kategori dan ringkasan di bawah terhitung otomatis. Angka boleh ditulis 25000, 25.000, Rp25.000, 25rb, atau 1,5jt. Baris contoh hanya contoh: ganti atau hapus. Tambah baris lewat menu Tabel.</p><h3>\u{1F35A} Makan &amp; belanja</h3>${zGen(zPgC,[["3","Belanja pasar","250.000"],["10","Makan di luar","120.000"]],3,zSp2(3,"tot","Total kategori"))}<h3>\u{1F697} Transport</h3>${zGen(zPgC,[["5","Bensin","100.000"],["12","Parkir &amp; tol","30.000"]],3,zSp2(3,"tot","Total kategori"))}<h3>\u{1F3E0} Rumah &amp; tagihan</h3>${zGen(zPgC,[["1","Listrik","450.000"],["5","Internet","350.000"]],3,zSp2(3,"tot","Total kategori"))}<h3>\u{1F468}\u200D\u{1F469}\u200D\u{1F467} Keluarga &amp; kesehatan</h3>${zGen(zPgC,[["8","Obat &amp; vitamin","85.000"]],3,zSp2(3,"tot","Total kategori"))}<h3>\u{1F3AC} Hiburan &amp; lainnya</h3>${zGen(zPgC,[["14","Nonton","100.000"]],3,zSp2(3,"tot","Total kategori"))}<h3>\u{1F4CA} Ringkasan</h3><table class="ed-table zn-calc"><thead><tr><th>Ringkasan</th><th data-c="s">Jumlah</th></tr></thead><tbody><tr data-r="grand"><td><b>Total pengeluaran bulan ini</b></td>${zF}</tr><tr data-r="bud"><td><b>Pemasukan / anggaran bulan ini (ketik)</b></td>${zTd("",1)}</tr><tr data-r="sisa"><td><b>Sisa (merah = melebihi)</b></td>${zF}</tr></tbody></table><p><br></p><h3>\u{1F4DD} Catatan</h3><p><br></p>`},{k:"cicilan",c:TCATS[4],i:"\u{1F4B3}",l:"Pelacak utang & cicilan",d:"Pokok, cicilan, jatuh tempo, sisa",t:()=>"Utang & cicilan",tags:["keuangan"],b:()=>`<h2>Utang &amp; Cicilan</h2>${tplT(["Pemberi pinjaman","Pokok (Rp)","Cicilan/bulan","Jatuh tempo","Sisa (Rp)"],tplR(5,5))}<h3>Strategi pelunasan</h3><p><br></p>`},{k:"tabungan",c:TCATS[4],i:"\u{1F3E6}",l:"Target tabungan",d:"Tujuan, jumlah, setoran, progres",t:()=>"Tabungan: ",tags:["keuangan"],b:()=>`<h2>Target</h2><p><b>Tujuan:</b> &nbsp; <b>Jumlah:</b> Rp &nbsp; <b>Tenggat:</b> </p><p><b>Setoran per bulan:</b> Rp </p>${tplT(["Bulan","Setoran (Rp)","Total (Rp)"],tplR(6,3))}<h3>Catatan</h3><p><br></p>`},{k:"olahra
