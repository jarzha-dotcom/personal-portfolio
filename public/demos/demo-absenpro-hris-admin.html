  <style>
    :root {
      --bg: #f1f5f9;
      --card: #fff;
      --ink: #0f172a;
      --mute: #64748b;
      --line: #e2e8f0;
      --chip: #e8eef4;
      --acc: #0d9488;
      --accink: #fff;
      --ok: #10b981;
      --late: #ef4444;

        --bg: #020617;
        --card: #0f172a;
        --ink: #e2e8f0;
        --mute: #94a3b8;
        --line: #1e293b;
        --chip: #1e293b

    }

      --bg: #020617;
      --card: #0f172a;
      --ink: #e2e8f0;
      --mute: #94a3b8;
      --line: #1e293b;
      --chip: #1e293b
    }

      box-sizing: border-box;
      margin: 0
    }

      --rl-ink: var(--ink);
      --rl-mute: var(--mute);
      --rl-line: var(--line);
      --rl-chip: var(--chip);
      --rl-acc: var(--acc);
      --rl-accink: var(--accink);
      --rl-ok: var(--ok);
      --rl-late: var(--late);
      background: var(--bg);
      color: var(--ink);
      font: 500 14px/1.45 var(--ff);
      min-height: 100vh;
      padding-bottom: 46px
    }

    h1,
    h2,
    h3,
    .fh {
      font-family: var(--fh);
      letter-spacing: -.02em
    }

    button {
      font-family: inherit
    }

    .shell {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: calc(100vh - 46px)
    }

    aside {
      background: var(--card);
      border-right: 1px solid var(--line);
      padding: 22px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: sticky;
      top: 0;
      height: calc(100vh - 46px)
    }

    .logo {
      font: 800 22px var(--fh);
      padding: 0 10px 4px
    }

    .logo span {
      color: var(--acc)
    }

    .tg {
      padding: 0 10px 16px;
      color: var(--mute);
      font-size: 12px
    }

    .nv {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 0;
      background: none;
      color: var(--mute);
      font: 600 14px var(--ff);
      padding: 11px 12px;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      text-decoration: none
    }

    .nv.on {
      background: var(--acc);
      color: var(--accink)
    }

    .bdg {
      background: var(--late);
      color: #fff;
      border-radius: 99px;
      font-size: 11px;
      padding: 1px 7px
    }

    .bdg[hidden] {
      display: none
    }

    .me {
      margin-top: auto;
      border-top: 1px solid var(--line);
      padding: 12px 8px 0;
      display: flex;
      gap: 10px;
      align-items: center
    }

    .av {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--bg);
      display: grid;
      place-items: center;
      font: 700 13px var(--fh);
      flex: none
    }

    main {
      padding: 26px 30px;
      max-width: 1240px;
      width: 100%;
      container-type: inline-size
    }

    .view {
      display: none
    }

    .view.on {
      display: block
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px
    }

    .btn {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      font: 600 13px var(--ff);
      padding: 9px 14px;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block
    }

    .btn.pri {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink)
    }

    .hd {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px
    }

    .hd h1 {
      font-size: 28px;
      font-weight: 800
    }

    .hd p {
      color: var(--mute)
    }

    .tools {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px
    }

    input[type=search],
    input[type=email],
    input[type=password],
    input[type=text],
    select {
      font: 500 14px var(--ff);
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      width: 100%
    }

    .tools input {
      flex: 1;
      min-width: 200px;
      width: auto
    }

    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px
    }

      background: var(--card);
      color: var(--ink);
      font: 600 13px var(--ff);
      padding: 8px 13px;

    function repRows(m) { const nd = new Date(2026, m, 0).getDate(); return RL.emp.map((e, ei) => { const ds = [], c = { p: 0, l: 0, i: 0 }; for (let d = 1; d <= nd; d++) { const s = dayStat(ei, m, d); ds.push(s); if (c[s] !== undefined) c[s]++ } const wd = c.p + c.l + c.i; return { e, ds, c, wd, pct: wd ? Math.round((c.p + c.l) / wd * 100) : 0, ot: (ei * 5 + m * 3) % 9 } }) }

    window.renderRep = function () {
      const R = repRows(REPM), avg = Math.round(R.reduce((a, r) => a + r.pct, 0) / R.length), sum = k => R.reduce((a, r) => a + r.c[k], 0), ot = R.reduce((a, r) => a + r.ot, 0);
      $('#repbody').innerHTML = '<div class="rl-kp" style="margin-bottom:14px"><div class="rl-card"><small>Rata-rata kehadiran</small><b>' + avg + '%</b><span>dari ' + R.length + ' karyawan</span></div><div class="rl-card"><small>Terlambat</small><b>' + sum('l') + '</b><span>kali dalam sebulan</span></div><div class="rl-card"><small>Izin dan cuti</small><b>' + sum('i') + '</b><span>hari</span></div><div class="rl-card rl-hl"><small>Lembur</small><b>' + ot + '</b><span>jam total</span></div></div><div class="card"><div class="tw"><table><thead><tr><th>Karyawan</th><th>Hadir</th><th>Terlambat</th><th>Izin atau cuti</th><th>Lembur (jam)</th><th>Kehadiran</th></tr></thead><tbody>' + R.map(r => '<tr><td><b>' + RL.esc(r.e[1]) + '</b><br><span class="sm">' + RL.esc(r.e[3]) + '</span></td><td>' + (r.c.p + r.c.l) + '</td><td>' + r.c.l + '</td><td>' + r.c.i + '</td><td>' + r.ot + '</td><td><b>' + r.pct + '%</b></td></tr>').join('') + '</tbody></table></div><p class="sm" style="margin-top:10px">Data contoh untuk keperluan demo.</p></div>'
    };

    boot();
  </script>
</body>
