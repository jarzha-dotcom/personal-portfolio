  <meta name="author" content="K. Arzhaning Jagad (Arzha)">

  <meta name="robots" content="noindex, nofollow">

  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <style>
    :root {
      --accent-ink: #14573B;
      --neutral-bg: #F3F4F6;
      --neutral-ink: #374151;
      --surface: #FFF;
      --ground: #F6F5F0;
      --ink: #1F2937;
      --muted: #4B5563;
      --line: #D1D5DB;
      --accent: #1B6B4A;
      --accent-soft: #E5F2EB;
      --warn: #78350F;
      --warn-bg: #FEF3C7;
      --warn-line: #B45309;
      --bad: #991B1B;
      --bad-bg: #FEE2E2;
      --bad-line: #B91C1C
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--ground);
      color: var(--ink);
      font-family: 'Atkinson Hyperlegible', system-ui, sans-serif;
      font-size: 18px;
      line-height: 1.4
    }

    #app {
      max-width: 560px;
      margin: 0 auto;
      padding: 28px 20px 130px;
      display: flex;
      flex-direction: column;
      gap: 16px
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2
    }

    p {
      margin: 0
    }

    .muted {
      color: var(--muted)
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .hero {
      background: var(--accent);
      color: #fff;
      border: 0
    }

    .big {
      font-size: 38px;
      font-weight: 700
    }

    .warn {
      background: var(--warn-bg);
      border: 2px solid var(--warn-line);
      color: var(--warn)
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px
    }

    .title {
      font-size: 22px;
      font-weight: 700
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 0 16px;
      border-radius: 14px;
      border: 2px solid var(--accent);
      background: var(--accent);
      color: #fff;
      font: 700 19px/1.2 inherit;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      width: 100%
    }

    .btn.alt {
      background: var(--surface);
      color: var(--accent);
      min-height: 48px;
      font-size: 18px
    }

    .btn.dark {
      background: var(--warn);
      border-color: var(--warn)
    }

    .btn:focus-visible,
    nav button:focus-visible {
      outline: 4px solid #1D4ED8;
      outline-offset: 2px
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .num {
      font-size: 32px;
      font-weight: 700
    }

    .room {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px
    }

    .room.pending {
      border: 2px solid var(--warn-line)
    }

    .room.late {
      border: 2px solid var(--bad-line)
    }

    .room.kosong {
      border: 2px dashed #6B7280
    }

    .badge {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: var(--accent-soft);
      color: var(--accent-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      flex: none
    }

    .pending .badge {
      background: var(--warn-bg);
      color: var(--warn)
    }

    .late .badge {
      background: var(--bad-bg);
      color: var(--bad)
    }

    .kosong .badge {
      background: var(--neutral-bg);
      color: var(--neutral-ink)
    }

    .room .who {
      flex: 1
    }

    .state {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent-ink);
      text-align: right
    }

    .pending .state {
      color: var(--warn)
    }

    .late .state {
      color: var(--bad)
    }

    .kosong .state {
      color: var(--neutral-ink)
    }

    .pay {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #E5E7EB
    }

    .pay:last-child {
      border: 0
    }

    .pay b {
      color: var(--accent)
    }

    label {
      font-weight: 700;
      display: block;
      margin-bottom: 6px
    }

    input,
    select {
      width: 100%;
      min-height: 56px;
      border: 2px solid #6B7280;
      border-radius: 12px;
      padding: 0 14px;
      font: inherit;
      background: #fff;
      color: var(--ink)
    }

    input:focus,
    select:focus {
      outline: 4px solid #1D4ED8;
      outline-offset: 2px
    }

    nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--surface);
      border-top: 1px solid var(--line);
      padding: 8px 8px calc(14px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: center
    }

    nav .in {
      display: flex;
      width: 100%;
      max-width: 560px
    }

    nav button {
      flex: 1;
      min-height: 56px;
      border: 0;
      background: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font: 400 15px inherit;
      font-family: inherit;
      color: var(--muted);
      cursor: pointer
    }

    nav button[aria-current=page] {
      font-weight: 700;
      color: var(--accent)
    }

    .credit {
      font-size: 14px;
      text-align: center;
      color: var(--muted)
    }

    .credit a {
      color: var(--accent)
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 110px;
      transform: translateX(-50%);
      background: #111827;
      color: #fff;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: 700;
      max-width: 90%;
      display: none;
      z-index: 40
    }

    .ov {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, .55);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 30
    }

    .sheet {
      background: var(--surface);
      width: 100%;
      max-width: 560px;
      border-radius: 24px 24px 0 0;
      padding: 22px 20px calc(24px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 90vh;
      overflow: auto
    }

    .sheet .title {
      font-size: 24px
    }

    .big2 {
      font-size: 30px;
      font-weight: 700
    }

    button.room {
      width: 100%;
      text-align: left;
      font: inherit;
      color: inherit;
      cursor: pointer
    }

    body.xl #app,
    body.xl .sheet {
      zoom: 1.18
    }

    .btn.alt.dangerbtn {
      color: var(--bad);
      border-color: var(--bad-line)
    }

    small {
      color: var(--muted);
      font-size: 15px
    }

    .hd {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px
    }

    .mini {
      min-height: 44px;
      width: auto;
      flex: none;
      padding: 0 14px;
      font-size: 16px
    }

    .badge2 {
      background: var(--warn-bg);
      color: var(--warn);
      border: 2px solid var(--warn-line);
      border-radius: 999px;
      padding: 2px 12px;
      font-size: 16px;
      font-weight: 700
    }

    nav button {
      font-size: 14px
    }

    .kpi,
    .cols,
    .colL,
    .colR {
      display: contents
    }

    .deskonly,
    .deskblk {
      display: none
    }

    .pay {
      align-items: center;
      gap: 12px
    }

    nav button {
      position: relative
    }

    nav .n {
      position: absolute;
      top: 0;
      left: calc(50% + 6px);
      background: var(--bad-line);
      color: #fff;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      padding: 0 7px;
      min-width: 22px;
      text-align: center
    }

    #brand,
    #sideUser {
      display: none
    }

    .bar {
      height: 14px;
      border-radius: 8px;
      background: #E5E7EB;
      overflow: hidden
    }

    .bar>i {
      display: block;
      height: 100%;
      border-radius: 8px;
      background: var(--accent)
    }

    .hero .bar {
      background: rgba(255, 255, 255, .3)
    }

    .hero .bar>i {
      background: #fff
    }

    .seg {
      display: flex;
      gap: 4px
    }

    .seg i {
      flex: 1;
      height: 12px;
      border-radius: 4px;
      background: var(--accent)
    }

    .seg i.e {
      background: #D1D5DB
    }

    .rg .room {
      padding: 12px;
      align-items: flex-start
    }

    .rg .state {
      display: block;
      text-align: left;
      font-size: 15px;
      margin-top: 2px
    }

    textarea {
      width: 100%;
      min-height: 130px;
      border: 2px solid #6B7280;
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      background: var(--surface);
      color: var(--ink);
      resize: vertical
    }

    textarea:focus {
      outline: 4px solid #1D4ED8;
      outline-offset: 2px
    }

    .sr {
      position: absolute;
      left: -9999px
    }

    .hd {
      flex-wrap: wrap
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 16px
    }

    .chart {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px
    }

    .mcol {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      border: 2px solid transparent;
      border-radius: 12px;
      background: none;
      font: inherit;
      color: inherit;
      cursor: pointer;
      padding: 8px 2px
    }

    .mcol[aria-current=true] {
      border-color: var(--accent);
      background: var(--accent-soft)
    }

    .mcol:focus-visible {
      outline: 4px solid #1D4ED8;
      outline-offset: 2px
    }

    .mcol .bars {
      height: 130px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 6px;
      width: 100%
    }

    .mcol .b {
      display: block;
      width: 40%;
      max-width: 34px;
      border-radius: 6px 6px 0 0
    }

    .mcol .b.m {
      background: var(--accent)
    }

    .mcol .b.k {
      background: var(--warn-line)
    }

    .mcol .l {
      font-size: 16px;
      font-weight: 700
    }

    .legend {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      font-size: 16px
    }

    .legend i {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 4px;
      vertical-align: -2px;
      margin-right: 6px
    }

    .rgrid,
    .menu {
      display: contents
    }

    .pair {
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .mi {
      justify-content: space-between;
      text-align: left;
      padding-top: 10px;
      padding-bottom: 10px;
      gap: 12px
    }

    .mi small {
      font-weight: 400
    }

    .ov {
      bottom: 46px
    }

    nav {
      bottom: 46px
    }

    #toast {
      bottom: 156px
    }

    @media(min-width:960px) {
      .rgrid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px
      }

      .menu {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px
      }

      #app>.rgrid,
      #app>.menu {
        grid-column: 1/-1
      }

      .pair {
        flex-direction: row
      }

      .pair .btn {
        flex: 1
      }

      body {
        padding-left: 268px
      }

      body.nologin {
        padding-left: 0
      }

      #app {
        max-width: 1180px;
        margin: 0 auto;
        padding: 36px 44px 48px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px 24px;
        align-items: start
      }

      #app>:first-child,
      #app>.credit,
      #app>.title {
        grid-column: 1/-1
      }

      #app>.btn {
        grid-column: 1/-1;
        justify-self: start;
        width: auto;
        min-width: 340px
      }

      #app[data-tab=beranda],
      #app[data-tab=p_beranda] {
        grid-template-columns: minmax(0, 1fr)
      }

      #app[data-tab=pengaturan],
      #app[data-tab=p_riwayat],
      #app[data-tab=akunBaru] {
        grid-template-columns: minmax(0, 680px)
      }

      #app[data-tab=tambah] {
        grid-template-columns: minmax(0, 680px) minmax(0, 1fr)
      }

      #app[data-tab=penghuni],
      #app[data-tab=akun] {
        grid-template-columns: repeat(3, minmax(0, 1fr))
      }

      #app[data-tab=penghuni] .row,
      #app[data-tab=akun] .row {
        flex-wrap: wrap
      }

      #app[data-tab=p_lapor] {
        grid-template-columns: minmax(0, 1fr)
      }

      #app[data-tab=login] {
        grid-template-columns: minmax(0, 520px);
        justify-content: center;
        padding-top: 72px
      }

      .kpi {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 20px;
        align-items: stretch
      }

      .kpi .hero {
        grid-column: span 2
      }

      .kpi .btn {
        margin-top: auto
      }

      .cols {
        display: grid;
        grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
        gap: 20px;
        align-items: start
      }

      .colL,
      .colR {
        display: flex;
        flex-direction: column;
        gap: 20px
      }

      .deskonly {
        display: flex
      }

      .deskblk {
        display: block
      }

      .mobonly {
        display: none !important
      }

      nav {
        top: 0;
        right: auto;
        width: 268px;
        border-top: 0;
        border-right: 1px solid var(--line);
        padding: 28px 16px 20px;
        flex-direction: column;
        justify-content: flex-start;
        align-items: stretch;
        overflow-y: auto
      }

      #brand {
        display: block;
        padding: 0 16px 22px
      }

      #brand b {
        display: block;
        font-size: 28px;
        line-height: 1.2;
        color: var(--accent)
      }

      #brand span {
        font-size: 15px;
        color: var(--muted)
      }

      nav .in {
        flex-direction: column;
        gap: 6px;
        max-width: none;
        flex: none
      }

      nav button {
        flex: none;
        flex-direction: row;
        justify-content: flex-start;
        gap: 14px;
        font-size: 18px;
        padding: 0 16px;
        border-radius: 12px;
        min-height: 56px;
        width: 100%
      }

      nav button[aria-current=page] {
        background: var(--accent-soft)
      }

      nav .n {
        position: static;
        margin-left: auto
      }

      #sideUser {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: auto;
        padding: 16px 8px 0;
        border-top: 1px solid #E5E7EB
      }

      .ov {
        align-items: center
      }

      .sheet {
        border-radius: 24px;
        max-width: 520px
      }

      #toast {
        bottom: 86px
      }
    }

    @media print {

      #__jz-bar,
      nav,
      #toast,
      .btn,
      .credit,
      .noprint {
        display: none !important
      }

      body,
      body.xl {
        padding-left: 0 !important;
        background: #fff
      }

      #app {
        display: block !important;
        max-width: none !important;
        padding: 0 !important
      }

      #app>* {
        margin-bottom: 12px
      }

      .card {
        break-inside: avoid
      }

      .kpi,
      .cols,
      .colL,
      .colR {
        display: block
      }

      body.print-kw #app {
        display: none !important
      }

      .ov {
        position: static;
        background: none;
        display: block
      }

      .sheet {
        max-height: none;
        overflow: visible;
        max-width: none;
        padding: 0
      }
    }

    .av {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      flex: none
    }

    .av.lg {
      width: 64px;
      height: 64px;
      font-size: 24px
    }
  </style>

  <style>
    /* Halaman Uang: tampilan baru */
    .credit a {
      display: inline-block;
      padding: 14px 6px;
      margin: -14px -6px
    }

    .tur-block {
      position: fixed;
      inset: 0;
      z-index: 60;
      touch-action: none
    }

    html.tur-lock,
    html.tur-lock body {
      overflow: hidden !important;
      overscroll-behavior: none
    }

    html.tur-lock {
      scrollbar-gutter: stable
    }

    .tur-spot {
      position: fixed;
      z-index: 61;
      border-radius: 14px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, .6);
      outline: 3px solid #FCD34D;
      pointer-events: none
    }

    .tur-card {
      position: fixed;
      z-index: 62;
      background: var(--surface);
      color: var(--ink);
      border: 2px solid var(--accent);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .35);
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: min(400px, calc(100vw - 24px));
      box-sizing: border-box;
      max-height: 80vh;
      overflow: auto
    }

    .tur-mid {
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%)
    }

    .tur-row {
      display: flex;
      gap: 10px
    }

    .tur-row .btn {
      flex: 1;
      min-height: 48px
    }

    .tur-x {
      background: none;
      border: 0;
      color: var(--muted);
      text-decoration: underline;

    ['Buka Lainnya, lalu Laporan keuangan. Ketuk "Catat uang keluar", pilih untuk apa (listrik, perbaikan, dan lainnya), isi jumlahnya, lalu Simpan.', 'Open More, then Financial report. Tap "Record expense", choose what it is for (electricity, repairs, and so on), enter the amount, then Save.'],
    ['Buka Lainnya, lalu Pengaturan. Isi nama bank, nomor rekening, dan gambar QRIS agar tampil di "Cara membayar" milik penghuni. Tulis peraturan kos satu per baris, penghuni akan diberi tahu.', 'Open More, then Settings. Enter the bank name, account number, and QRIS image so they show in the tenant "How to pay". Write the house rules one per line and tenants will be notified.'],
    ['Buka menu Penghuni, ketuk "Kirim pengumuman ke semua penghuni". Tulis pesan lalu ketuk "Tampilkan di portal penghuni". Untuk WhatsApp, ketuk nama penghuni satu per satu.', 'Open Tenants and tap "Send announcement to all tenants". Write the message, then tap "Show in tenant portal". For WhatsApp, tap each tenant name.'],
    ['Buka menu Uang. Ketuk "Ingatkan lewat WhatsApp" di bawah nama penghuni.', 'Open Money. Tap "Remind via WhatsApp" under the tenant name.'],
    ['Di menu Uang, ketuk "Sudah bayar? Catat di sini", lalu pilih Tunai, Transfer bank, atau QRIS.', 'In Money, tap "Paid? Record here", then choose Cash, Bank transfer, or QRIS.'],
    ['Setelah mencatat pembayaran, ketuk "Kirim kwitansi lewat WhatsApp". Kwitansi lama ada di Uang, pada daftar "Baru saja membayar".', 'After recording a payment, tap "Send receipt via WhatsApp". Older receipts are in Money, under "Recently paid".'],
    ['Laporan muncul di Beranda pada kotak "Kabar dari penghuni". Telepon tukang, lalu tekan "Sudah selesai" kalau beres.', 'Reports appear on Home in the "News from tenants" box. Call the handyman, then press "Done" when fixed.'],
    ['Data hanya tersimpan di browser ini. Kalau riwayat browser dihapus atau Anda membuka dari perangkat lain, data kembali seperti awal. Cadangan data belum ada di demo ini.', 'Data is stored only in this browser. If browser history is cleared or you open it on another device, data returns to the start. Data backup is not available in this demo.'],
    ['Kamar ini hilang dari daftar. Riwayat pembayaran lama tetap tersimpan.', 'This room disappears from the list. Past payment history is kept.'],
    ['Semua pembayaran, penghuni baru, laporan, dan pengaturan yang tadi dicatat akan dihapus.', 'All payments, new tenants, reports, and settings recorded so far will be deleted.'],
    ['Penghuni ini tidak bisa masuk lagi ke portal sampai akun dibuat ulang.', 'This tenant cannot log in to the portal again until the account is recreated.'],
    ['Minta pemilik kos mengembalikan sandi Anda ke sandi awal. Setelah masuk, Anda bisa menggantinya sendiri.', 'Ask the owner to reset your password to the default. After logging in you can change it yourself.'],
    ['Mau lihat tampilannya di sisi Rajendra? Kalau pemilik mengubah status laporan, halaman ini ikut berubah. Dibuka di tab baru, jadi halaman ini tetap ada.', 'Want to see how it looks on the side of Rajendra? If the owner changes the report status, this page changes too. It opens in a new tab, so this page stays.'],
    ['Air PDAM mati hari Senin pukul 09.00 sampai 12.00 karena perbaikan pipa. Mohon tampung air lebih dulu.', 'The water supply will be off on Monday from 09.00 to 12.00 for pipe repairs. Please store water beforehand.'],
    ['Jam tamu sampai pukul 21.00. Dilarang merokok di dalam kamar. Jaga ketenangan setelah pukul 22.00. Sewa dibayar paling lambat pada tanggal jatuh tempo. Laporkan kerusakan lewat portal penghuni.', 'Visiting hours end at 21.00. No smoking inside rooms. Keep quiet after 22.00. Rent is paid by the due date at the latest. Report damage through the tenant portal.'],
    ['Jam tamu sampai pukul 21.00.', 'Visiting hours end at 21.00.'], ['Dilarang merokok di dalam kamar.', 'No smoking inside rooms.'], ['Jaga ketenangan setelah pukul 22.00.', 'Keep quiet after 22.00.'], ['Sewa dibayar paling lambat pada tanggal jatuh tempo.', 'Rent is paid by the due date at the latest.'], ['Laporkan kerusakan lewat portal penghuni.', 'Report damage through the tenant portal.'],
    ['Centang fitur yang berguna untuk kos Anda, lalu kirim daftarnya lewat WhatsApp. Biaya dan jadwal pengerjaan dibicarakan langsung.', 'Tick the features that are useful for your boarding house, then send the list via WhatsApp. Cost and schedule are discussed directly.'],
    ['Rencana fitur yang bisa ditambahkan. Belum aktif di demo ini.', 'Planned features that can be added. Not active in this demo.'],
    ['Atur denda tetap atau per hari. Tagihan bertambah sendiri setelah lewat tempo, dan penghuni melihat rinciannya.', 'Set a fixed or daily late fee. The bill grows by itself after the due date, and tenants see the details.'],
    ['Catat angka meteran tiap bulan, tarif dihitung otomatis, lalu ditambahkan ke tagihan kamar.', 'Record the meter reading each month, the tariff is calculated automatically, then added to the room bill.'],
    ['Catat calon penghuni, uang muka, dan tanggal masuk. Kamar kosong ditandai "dibooking" supaya tidak dobel.', 'Record prospective tenants, deposits, and move-in dates. Vacant rooms are marked "booked" to avoid double booking.'],
    ['Catatan siapa mengubah apa dan kapan, untuk menghindari salah catat dan perselisihan.', 'A log of who changed what and when, to avoid mistakes and disputes.'],
    ['Daftar barang per kamar (kasur, lemari, AC) dengan pengingat servis AC dan penggantian.', 'A list of items per room (bed, wardrobe, AC) with reminders for AC servicing and replacement.'],
    ['Daftar periksa dan foto saat masuk dan keluar. Dipakai sebagai dasar hitungan uang jaminan.', 'Checklist and photos at move-in and move-out. Used as the basis for the deposit calculation.'],
    ['Dipasang seperti aplikasi biasa dari browser, dengan ikon sendiri dan tetap terbuka saat sinyal lemah.', 'Installed like a regular app from the browser, with its own icon, and stays usable when the signal is weak.'],
    ['Foto KTP dan kontrak tersimpan rapi per kamar, tidak lagi tercecer di galeri HP.', 'ID photos and contracts are stored neatly per room, no longer scattered in the phone gallery.'],
    ['Grafik hunian per bulan, kamar yang paling lama kosong, dan saran penyesuaian harga.', 'Monthly occupancy charts, the longest-vacant rooms, and price adjustment suggestions.'],
    ['Jadwal area bersama dan giliran piket, lengkap dengan tanda sudah dikerjakan.', 'Schedule for shared areas and duty rotation, with a done mark.'],
    ['Kelola beberapa lokasi dari satu aplikasi, dengan ringkasan gabungan dan ringkasan per lokasi.', 'Manage several locations from one app, with combined and per-location summaries.'],
    ['Masuk dengan kode sekali pakai, dan sandi tersimpan terenkripsi di server.', 'Log in with a one-time code, and passwords are stored encrypted on the server.'],
    ['Pemberitahuan muncul di layar HP saat tagihan terbit, bukti diterima, atau laporan kerusakan selesai.', 'Notifications appear on the phone screen when a bill is issued, proof is received, or a damage report is done.'],
    ['Pemilik dan penghuni membuka data yang sama dari HP masing-masing, kapan saja.', 'Owner and tenants open the same data from their own phones, anytime.'],
    ['Penghuni membayar langsung dari HP, dan status sewa berubah lunas sendiri. Tidak perlu unggah bukti atau cek manual.', 'Tenants pay directly from their phone, and the rent status turns paid by itself. No need to upload proof or check manually.'],
    ['Penghuni mendaftarkan tamu dari portal, dan pemilik menyetujui sesuai peraturan kos.', 'Tenants register guests from the portal, and the owner approves according to the house rules.'],
    ['Penjaga kos hanya bisa mencatat bayar dan paket, tanpa melihat laporan keuangan.', 'The caretaker can only record payments and parcels, without seeing the financial report.'],
    ['Penjaga mencatat paket yang datang, dan penghuni langsung melihatnya di portal.', 'The caretaker records arriving parcels, and tenants see them in the portal right away.'],
    ['Pesan terkirim sendiri pada H-3, hari jatuh tempo, dan setelah lewat tempo, dengan kalimat yang bisa Anda atur.', 'Messages are sent automatically 3 days before, on the due date, and after it passes, with wording you can set.'],
    ['Rekap pendapatan dan pengeluaran setahun dalam PDF atau Excel, siap diserahkan ke akuntan.', 'A yearly summary of income and expenses in PDF or Excel, ready to hand to an accountant.'],
    ['Saat penghuni keluar, potong kerusakan atau tunggakan, hitung yang dikembalikan, lalu cetak berita acara.', 'When a tenant moves out, deduct damage or arrears, calculate the refund, then print the handover report.'],
    ['Sebulan sebelum sewa berakhir, penghuni menerima tawaran perpanjang dan bisa menjawab dari portal.', 'A month before the lease ends, tenants receive an extension offer and can reply from the portal.'],
    ['Setiap Senin pagi: uang masuk, yang belum bayar, kamar kosong, dan laporan kerusakan yang belum selesai.', 'Every Monday morning: income, unpaid tenants, vacant rooms, and unfinished damage reports.'],
    ['Tagihan baru muncul setiap tanggal jatuh tempo tanpa perlu menekan "Perpanjang sewa" satu per satu.', 'New bills appear on each due date without pressing "Extend rent" one by one.'],
    ['Transfer yang masuk dicocokkan ke tagihan penghuni secara otomatis, jadi pemilik tidak mencatat satu per satu.', 'Incoming transfers are matched to tenant bills automatically, so the owner does not record them one by one.'],
    ['Ada biaya tukang atau bahan? Catat supaya laporan keuangan lengkap.', 'Any labor or material cost? Record it so the financial report is complete.'],
