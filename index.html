    rel="stylesheet">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!--
      Preload gambar profil (LCP kandidat utama di Hero). GANTI src di
      bawah dengan path asli file gambar profil setelah build (contoh:
      /assets/profile-abc123.webp) — path bergantung nama file hasil
      Vite, jadi tidak bisa di-hardcode generik di sini.
  -->
  <!-- <link rel="preload" as="image" href="/path/ke/foto-profil.webp" fetchpriority="high" /> -->

  <!--
      Structured Data (Schema.org JSON-LD)
      Catatan keamanan: telepon, email, dan nama pemberi kerja SENGAJA
      tidak dicantumkan di sini. Data ini teks mentah yang langsung
      terbaca bot/scraper begitu HTML dimuat (beda dengan nomor WA di
      komponen React yang baru muncul setelah JS jalan) — nggak ada
      manfaat SEO yang sepadan dengan risikonya. Kalau butuh channel
      kontak yang terindeks Google, arahkan ke URL halaman kontak, bukan
      taruh nomor/email mentah.
    -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "K. Arzhaning Jagad",
      "jobTitle": "Freelance Web, Mobile & Game Developer",
      "url": "https://byarzhaning.online",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Cibitung, Bekasi",
        "addressRegion": "Jawa Barat",
        "addressCountry": "ID"
      },
      "knowsAbout": ["React", "TypeScript", "Node.js", "React Native", "Mobile App Development", "Game Development", "Web Development", "Audit Internal", "Analisis Data"]
    }
    </script>

  <!-- WebSite — membantu Google mengenali identitas & bahasa situs -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "K. Arzhaning Jagad — Jasa Development",
      "url": "https://byarzhaning.online",
      "inLanguage": "id"
    }
    </script>

  <!--
      ProfessionalService — sinyal "jasa lokal" untuk pencarian seperti
      "jasa developer Bekasi". Catatan keamanan yang sama seperti Person
      di atas berlaku: tanpa telepon/email mentah, hanya arahkan ke
      halaman kontak.
    -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "K. Arzhaning Jagad — Jasa Development",
      "url": "https://byarzhaning.online",
      "image": "https://byarzhaning.online/og-image.png",
      "priceRange": "Rp 800rb - Rp 12jt",
      "areaServed": {
        "@type": "AdministrativeArea",
        "name": "Jabodetabek"
      },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Cibitung, Bekasi",
        "addressRegion": "Jawa Barat",
        "addressCountry": "ID"
      }
    }
    </script>

  <!--
      Favicon — memakai file PNG hasil crop logo asli di public/.
      SVG placeholder generik ("KAJ" teks putih di kotak teal) sudah
      dihapus supaya tidak bersaing prioritas dengan browser yang kadang
      mengutamakan format vektor walau isinya bukan logo final.
    -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
